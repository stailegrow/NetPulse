[package]
name = "netpulse-icmp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Cross-platform unprivileged ICMP echo / TTL probing (macOS, Windows, Linux)"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
