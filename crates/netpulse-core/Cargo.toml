[package]
name = "netpulse-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "NetPulse monitoring engine: trace, checks, stats, storage, alerts"

[dependencies]
netpulse-icmp = { path = "../netpulse-icmp" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-parser = "0.16"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname"] }
dns-lookup = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
log = "0.4"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
